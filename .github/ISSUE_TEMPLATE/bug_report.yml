---
name: Bug Report
description: Report a bug or unexpected behavior in BeaudyShell
title: '[BUG] '
labels: ['bug']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: e.g., The shell crashes when I press Tab
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., Linux, macOS, Windows
      placeholder: Linux
    validations:
      required: true
  - type: input
    id: beaudyshell-version
    attributes:
      label: BeaudyShell Version
      description: e.g., 0.1.0
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: e.g., 1.75.0
      placeholder: 1.75.0
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: e.g., gnome-terminal, alacritty, Windows Terminal
      placeholder: gnome-terminal
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Screenshots, terminal output, configuration file contents, etc.
