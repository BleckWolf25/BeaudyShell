---
name: Accessibility Issue
description: Report accessibility-related issues or improvements for BeaudyShell
title: '[A11Y] '
labels: ['accessibility']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BeaudyShell accessibility!
  - type: textarea
    id: accessibility-issue
    attributes:
      label: Accessibility Issue
      description: A clear and concise description of the accessibility issue
      placeholder: e.g., Screen reader doesn't announce command completion
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: How does this issue affect users with disabilities?
      options:
        - label: Screen reader compatibility
          required: false
        - label: Keyboard navigation
          required: false
        - label: Color contrast
          required: false
        - label: Font readability
          required: false
        - label: Other (please specify in additional context)
          required: false
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: If applicable, describe how to reproduce the accessibility issue
      placeholder: |
        1. Enable screen reader
        2. Start typing a command
        3. Press Tab for completion
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or improvement
      placeholder: Add OSC 133 markers for command completion
    validations:
      required: true
  - type: dropdown
    id: assistive-technology
    attributes:
      label: Assistive Technology Used
      description: Which assistive technologies are you using?
      options:
        - NVDA
        - JAWS
        - VoiceOver
        - Orca
        - Keyboard only
        - Screen magnifier
        - Other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the accessibility issue here
      placeholder: Screen reader output, specific configuration, relevant standards, etc.
