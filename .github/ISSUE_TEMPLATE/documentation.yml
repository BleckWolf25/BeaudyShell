---
name: Documentation
description: Report issues or suggest improvements for BeaudyShell documentation
title: '[DOCS] '
labels: ['documentation']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BeaudyShell documentation!
  - type: textarea
    id: documentation-issue
    attributes:
      label: Documentation Issue
      description: A clear and concise description of the documentation issue
      placeholder: e.g., The README doesn't explain how to configure the prompt
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: Location
      description: Where in the documentation is this issue located?
      options:
        - README.md
        - Code comments
        - Inline documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: proposed-changes
    attributes:
      label: Proposed Changes
      description: Describe the changes you'd like to see made to the documentation
      placeholder: Add a section explaining configuration options
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the documentation issue here
